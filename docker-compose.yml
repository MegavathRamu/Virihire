# Naukri microservices — one command brings up the whole thing.
# gateway (REST) + 3 gRPC services + 3 MongoDBs (database-per-service).
services:
  # ---------- Databases (one per service) ----------
  authdb:
    image: mongo:7
    volumes: [authdb-data:/data/db]
    ports: ["27017:27017"]

  profiledb:
    image: mongo:7
    volumes: [profiledb-data:/data/db]
    ports: ["27018:27017"]

  jobdb:
    image: mongo:7
    volumes: [jobdb-data:/data/db]
    ports: ["27019:27017"]

  campaigndb:
    image: mongo:7
    volumes: [campaigndb-data:/data/db]
    ports: ["27020:27017"]

  notifydb:
    image: mongo:7
    volumes: [notifydb-data:/data/db]
    ports: ["27021:27017"]

  verifydb:
    image: mongo:7
    volumes: [verifydb-data:/data/db]
    ports: ["27022:27017"]

  # ---------- Services ----------
  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    environment:
      PORT: "50051"
      MONGO_URL: "mongodb://authdb:27017/authdb"
      JWT_SECRET: "dev-secret-change-me"
      PROTO_DIR: "/app/proto"
    depends_on: [authdb]
    ports: ["50051:50051"]

  profile:
    build: { context: ., dockerfile: services/profile/Dockerfile }
    environment:
      PORT: "50052"
      MONGO_URL: "mongodb://profiledb:27017/profiledb"
      JOB_SERVICE_URL: "job:50053"
      PROTO_DIR: "/app/proto"
    depends_on: [profiledb, job]
    ports: ["50052:50052"]

  job:
    build: { context: ., dockerfile: services/job/Dockerfile }
    environment:
      PORT: "50053"
      MONGO_URL: "mongodb://jobdb:27017/jobdb"
      PROTO_DIR: "/app/proto"
    depends_on: [jobdb]
    ports: ["50053:50053"]

  search:
    build: { context: ., dockerfile: services/search/Dockerfile }
    environment:
      PORT: "50054"
      PROFILE_SERVICE_URL: "profile:50052"
      # Set VOYAGE_API_KEY to switch from local-hash to Voyage semantic embeddings.
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    depends_on: [profile]
    ports: ["50054:50054"]

  campaign:
    build: { context: ., dockerfile: services/campaign/Dockerfile }
    environment:
      PORT: "50055"
      MONGO_URL: "mongodb://campaigndb:27017/campaigndb"
      AUTH_SERVICE_URL: "auth:50051"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-sandbox}"
      # Optional: SENDGRID_API_KEY, EMAIL_FROM, ANTHROPIC_API_KEY for real send + LLM.
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on: [campaigndb, auth]
    ports: ["50055:50055"]

  notify:
    build: { context: ., dockerfile: services/notify/Dockerfile }
    environment:
      PORT: "50056"
      MONGO_URL: "mongodb://notifydb:27017/notifydb"
      PROFILE_SERVICE_URL: "profile:50052"
      AUTH_SERVICE_URL: "auth:50051"
      SMS_PROVIDER: "${SMS_PROVIDER:-sandbox}"
      # Optional real SMS: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM: "${TWILIO_FROM:-}"
    depends_on: [notifydb, profile, auth]
    ports: ["50056:50056"]

  verify:
    build: { context: ., dockerfile: services/verify/Dockerfile }
    environment:
      PORT: "50057"
      MONGO_URL: "mongodb://verifydb:27017/verifydb"
    depends_on: [verifydb]
    ports: ["50057:50057"]

  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "auth:50051"
      PROFILE_SERVICE_URL: "profile:50052"
      JOB_SERVICE_URL: "job:50053"
      SEARCH_SERVICE_URL: "search:50054"
      CAMPAIGN_SERVICE_URL: "campaign:50055"
      NOTIFY_SERVICE_URL: "notify:50056"
      VERIFY_SERVICE_URL: "verify:50057"
      PROTO_DIR: "/app/proto"
    depends_on: [auth, profile, job, search, campaign, notify, verify]
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on: [gateway]
    ports: ["3000:3000"]

volumes:
  authdb-data:
  profiledb-data:
  jobdb-data:
  campaigndb-data:
  notifydb-data:
  verifydb-data:
