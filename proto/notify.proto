syntax = "proto3";

package notify;

// Notification Service — on a new job, recommend it to matching candidates and
// notify them by SMS. Owns notifydb (notification log + dedup).
service NotificationService {
  rpc RecommendForJob(JobEvent)      returns (Ack);            // fire-and-forget trigger
  rpc GetJobNotifications(JobRef)    returns (NotificationList);
}

// Emitted when a recruiter posts a job ("job.created" event).
message JobEvent {
  string jobId       = 1;
  string title       = 2;
  string company     = 3;
  repeated string skills = 4;
  string description  = 5;
}

message Ack {
  bool accepted = 1;
}

message JobRef {
  string jobId = 1;
}

message Notification {
  string candidateId = 1;
  string name        = 2;
  string phone       = 3;
  float  score       = 4;
  string status      = 5; // sent | failed | skipped
  string channel     = 6; // sms
  string error       = 7;
}

message NotificationList {
  repeated Notification notifications = 1;
}
