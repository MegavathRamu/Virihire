syntax = "proto3";

package campaign;

// Campaign Service — async email to selected candidates.
// Owns campaigndb (campaigns + per-recipient email log).
service CampaignService {
  rpc CreateCampaign(CampaignReq) returns (Campaign);
  rpc GetCampaign(CampaignId)     returns (Campaign);
}

message CampaignReq {
  string recruiterId          = 1;
  string subject              = 2;
  string message              = 3;
  repeated string candidateIds = 4;
}

message Recipient {
  string candidateId = 1;
  string name        = 2;
  string email       = 3;
  string status      = 4; // queued | sent | failed
  string error       = 5;
}

message Campaign {
  string id        = 1;
  string subject   = 2;
  string message   = 3;
  string status    = 4; // queued | sending | done
  repeated Recipient recipients = 5;
  int32  total     = 6;
  int32  sent      = 7;
  int32  failed    = 8;
  string createdAt = 9;
}

message CampaignId {
  string id = 1;
}
